  .mode-row button.active { border-color:var(--primary); color:var(--primary); background:#EDEFFC; font-weight:700; }

  .q-text { font-size:16px; line-height:1.7; margin-bottom:14px; font-weight:700; }
  .option { display:block; width:100%; text-align:left; padding:12px; margin-bottom:8px; border:1.5px solid #DDD; border-radius:8px; background:#fff; font-size:15px; line-height:1.5; cursor:pointer; }

  .type-tag.case { background:#FBE9E7; color:#BF360C; }
  .analysis { display:none; background:#FFF8E1; border-left:4px solid var(--accent); border-radius:0 8px 8px 0; padding:12px; margin-top:10px; font-size:14px; line-height:1.7; }
  .analysis.show { display:block; }
  #analysisText { white-space:pre-wrap; line-height:1.8; }
  .analysis .src { color:var(--muted); font-size:12px; margin-top:6px; }
  .action-row { display:flex; gap:8px; margin-top:12px; }

  .btn-plain { background:#EEE; color:var(--text); }

  <section id="viewStats" style="display:none;">

        <input type="file" id="fileBank" accept=".json,application/json" style="display:none;" onchange="importBank(event)">
      </div>
    </div>
  </section>
</main>

/* ========== 状态与持久化（localStorage） ========== *//* ========== 状态与持久化（localStorage） ========== */
const LS = {
  userBank: 'yj08_userBank',
  record: 'yj08_record',
  wrong: 'yj08_wrong',
  checkins: 'yj08_checkins'
};
function lsGet(k, def) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch (e) { return def; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* ignore */ } }

let bank = [];
let quiz = [];          // 当前练习队列（题目数组）
let qpos = 0;           // 当前题目下标
let mode = 'seq';       // seq | rnd
let filter = { subject: '全部', year: 'all', type: '全部' };
let multiPicked = [];   // 多选题已选项

function getBank() {
  const ub = lsGet(LS.userBank, null);
  return (ub && Array.isArray(ub) && ub.length > 0) ? ub : DEFAULT_BANK;
}
function refreshBankInfo() {
  const subs = new Set(bank.map(q => q.subject || '未分类')).size;
  const years = new Set(bank.map(q => q.year || '未知')).size;
  let txt = '题库 ' + bank.length + ' 题 · ' + subs + ' 个科目';
  if (bank.length && bank.some(q => q.year !== undefined)) txt += ' · ' + years + ' 个年份';
  document.getElementById('bankInfo').textContent = txt;
}
function subjects() {
  const arr = [];
  bank.forEach(q => { const s = q.subject || '未分类'; if (!arr.includes(s)) arr.push(s); });
  return ['全部'].concat(arr);
}
function yearOptions() {
  // 返回 [{value,label}]：value 为 all 或 "year|exam"
  const seen = [];
  const out = [{ value: 'all', label: '全部年份' }];
  const subj = filter.subject;
  bank.forEach(q => {
    if (subj !== '全部' && q.subject !== subj) return;
    if (q.year === undefined || q.year === null || q.year === '') return;
    const key = q.year + '|' + (q.exam || '');
    if (seen.includes(key)) return;
    seen.push(key);
    out.push({ value: key, label: (q.exam ? q.year + ' ' + q.exam : q.year + '年') });
  });
  return out;
}
function typeOptions() {
  const arr = [];
  bank.forEach(q => { const t = q.type || '单选'; if (!arr.includes(t)) arr.push(t); });
  return ['全部'].concat(arr);
}
function buildFilters() {
  const subjSel = document.getElementById('subjectSel');
  subjSel.innerHTML = '';
  subjects().forEach(s => {
    const op = document.createElement('option');
    op.value = s; op.textContent = s;
    subjSel.appendChild(op);
  });
  subjSel.value = filter.subject || '全部';
  buildYearSel();
  const typeSel = document.getElementById('typeSel');
  typeSel.innerHTML = '';
  typeOptions().forEach(t => {
    const op = document.createElement('option');
    op.value = t; op.textContent = t;
    typeSel.appendChild(op);
  });
  typeSel.value = filter.type || '全部';
}
function buildYearSel() {
  const yearSel = document.getElementById('yearSel');
  yearSel.innerHTML = '';
  const opts = yearOptions();
  opts.forEach(yo => {
    const op = document.createElement('option');
    op.value = yo.value; op.textContent = yo.label;
    yearSel.appendChild(op);
  });
  yearSel.value = opts.some(yo => yo.value === filter.year) ? filter.year : 'all';
}
function onFilterChange(which) {
  if (which === 'subject') { filter.subject = document.getElementById('subjectSel').value; filter.year = 'all'; buildYearSel(); }
  else if (which === 'year') { filter.year = document.getElementById('yearSel').value; }
  else if (which === 'type') { filter.type = document.getElementById('typeSel').value; }
  startQuiz();
}
function startQuiz() {
  const pool = bank.filter(q => {
    if (filter.subject !== '全部' && q.subject !== filter.subject) return false;
    if (filter.year !== 'all') {
      const parts = String(filter.year).split('|');
      if (String(q.year) !== parts[0]) return false;
      if ((q.exam || '') !== (parts[1] || '')) return false;
    }
    if (filter.type !== '全部' && (q.type || '单选') !== filter.type) return false;
    return true;
  });
  if (pool.length === 0) {
    document.getElementById('qText').textContent = '当前筛选下暂无题目，请调整筛选条件';
    document.getElementById('qIndex').textContent = '0 / 0';
    document.getElementById('qOptions').innerHTML = '';
    document.getElementById('qAnalysis').classList.remove('show');
    document.getElementById('btnSubmitMulti').style.display = 'none';
    document.getElementById('btnShowAns').style.display = 'none';
    document.getElementById('btnNext').textContent = '下一题';
    return;
  }
  quiz = mode === 'rnd' ? shuffle(pool) : pool;
  qpos = 0;
  renderQuestion();
}
function setMode(m) {
  mode = m;
  document.getElementById('modeSeq').classList.toggle('active', m === 'seq');
  document.getElementById('modeRnd').classList.toggle('active', m === 'rnd');
  startQuiz();
}
function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function letter(i) { return String.fromCharCode(65 + i); }
function answered(rec, id) { return rec && rec[id]; }
function qType(q) { return q.type || (Array.isArray(q.options) && q.options.length ? '单选' : '案例'); }
function qMeta(q) {
  const parts = [];
  if (q.subject) parts.push(q.subject);
  if (q.year !== undefined && q.year !== '') parts.push(String(q.year) + (q.exam ? ' ' + q.exam : ''));
  return parts.join(' · ');
}
function renderTypeTag(q) {
  const t = qType(q);
  const isCase = t === '案例' || !Array.isArray(q.options) || q.options.length === 0;
  return '<span class="type-tag' + (isCase ? ' case' : '') + '">' + t + '</span>';
}
function renderQuestion() {
  if (!quiz.length) return;
  const oldtt = document.getElementById('multiResult');
  if (oldtt) oldtt.remove();
  const q = quiz[qpos];
  const t = qType(q);
  const isCase = t === '案例' || !Array.isArray(q.options) || q.options.length === 0;
  document.getElementById('qChapter').innerHTML = renderTypeTag(q) + '<span>' + qMeta(q) + '</span>';
  document.getElementById('qIndex').textContent = (qpos + 1) + ' / ' + quiz.length;
  document.getElementById('qText').textContent = q.question;
  const box = document.getElementById('qOptions');
  box.innerHTML = '';
  const an = document.getElementById('qAnalysis');
  an.classList.remove('show');
  document.getElementById('btnSubmitMulti').style.display = 'none';
  document.getElementById('btnShowAns').style.display = 'none';
  const rec = lsGet(LS.record, {});
  const isAnswered = answered(rec, q.id);

  if (isCase) {
    document.getElementById('btnShowAns').style.display = '';
    document.getElementById('btnNext').textContent = '下一题';
    return;
  }
  if (t === '多选') {
    multiPicked = isAnswered ? (rec[q.id].picked || []).slice() : [];
    (q.options || []).forEach((opt, i) => {
      const btn = document.createElement('button');
      btn.className = 'option' + (multiPicked.includes(letter(i)) ? ' picked' : '');
      const hasPrefix = /^\s*[A-Ea-e][.、．]/.test(opt);
      btn.textContent = hasPrefix ? opt : letter(i) + '. ' + opt;
      btn.onclick = () => {
        if (isAnswered) return;
        const L = letter(i);
        const idx = multiPicked.indexOf(L);
        if (idx >= 0) multiPicked.splice(idx, 1); else multiPicked.push(L);
        btn.classList.toggle('picked', multiPicked.includes(L));
      };
      if (isAnswered) {
        btn.disabled = true;
        if (q.answer.includes(letter(i))) btn.classList.add('correct');
        else if (multiPicked.includes(letter(i))) btn.classList.add('wrong');
      }
      box.appendChild(btn);
    });
    if (!isAnswered) document.getElementById('btnSubmitMulti').style.display = '';
    document.getElementById('btnNext').textContent = '下一题';
    return;
  }
  // 单选
  (q.options || []).forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    const hasPrefix = /^\s*[A-Ea-e][.、．]/.test(opt);
    btn.textContent = hasPrefix ? opt : letter(i) + '. ' + opt;
    btn.onclick = () => choose(q, letter(i), btn, box);
    if (isAnswered) {
      btn.disabled = true;
      if (letter(i) === q.answer) btn.classList.add('correct');
    }
    box.appendChild(btn);
  });
  if (isAnswered) {
    document.getElementById('analysisText').textContent = q.analysis || '（暂无解析）';
    document.getElementById('analysisSrc').textContent = q.source ? '出处：' + q.source : '';
    an.classList.add('show');
    document.getElementById('btnNext').textContent = '下一题';
  } else {
    document.getElementById('btnNext').textContent = '跳过';
  }
}
function showAnalysis(q) {
  document.getElementById('analysisText').textContent = q.analysis || '（暂无解析）';
  document.getElementById('analysisSrc').textContent = q.source ? '出处：' + q.source : '';
  document.getElementById('qAnalysis').classList.add('show');
}
function choose(q, choice, btn, box) {
  if (answered(lsGet(LS.record, {}), q.id)) return;
  const rec = lsGet(LS.record, {});
  rec[q.id] = { correct: choice === q.answer, t: Date.now() };
  lsSet(LS.record, rec);
  if (choice !== q.answer) {
    const wr = lsGet(LS.wrong, []);
    if (!wr.includes(q.id)) wr.push(q.id);
    lsSet(LS.wrong, wr);
  }
  box.querySelectorAll('.option').forEach(b => b.disabled = true);
  btn.classList.add(choice === q.answer ? 'correct' : 'wrong');
  box.querySelectorAll('.option').forEach(b => {
    if (b.textContent.trim().charAt(0).toUpperCase() + '.' === q.answer + '.') b.classList.add('correct');
  });
  showAnalysis(q);
  document.getElementById('btnNext').textContent = '下一题';
  renderStats();
}
function submitMulti() {
  const q = quiz[qpos];
  if (answered(lsGet(LS.record, {}), q.id)) return;
  const right = Array.from(String(q.answer).split('')).sort().join('');
  const picked = multiPicked.slice().sort().join('');
  const correct = picked === right;
  const rec = lsGet(LS.record, {});
  rec[q.id] = { correct: correct, picked: multiPicked.slice(), t: Date.now() };
  lsSet(LS.record, rec);
  if (!correct) {
    const wr = lsGet(LS.wrong, []);
    if (!wr.includes(q.id)) wr.push(q.id);
    lsSet(LS.wrong, wr);
  }
  const box = document.getElementById('qOptions');
  box.querySelectorAll('.option').forEach(b => b.disabled = true);
  box.querySelectorAll('.option').forEach(b => {
    const L = b.textContent.trim().charAt(0).toUpperCase();
    if (q.answer.includes(L)) b.classList.add('correct');
    else if (multiPicked.includes(L)) b.classList.add('wrong');
  });
  document.getElementById('btnSubmitMulti').style.display = 'none';
  const miss = right.split('').filter(L => !multiPicked.includes(L)).join('');
  const over = multiPicked.filter(L => !right.includes(L)).join('');
  let tip = '';
  if (correct) tip = '✅ 全部选对，得 2 分';
  else {
    if (over) tip = '❌ 多选了 ' + over + '，不得分（本题答案 ' + right + '）';
    else tip = '⚠️ 少选了 ' + miss + '，只得 0.5 分（本题答案 ' + right + '）';
  }
  showAnalysis(q);
  const tt = document.createElement('div');
  tt.id = 'multiResult';
  tt.style.cssText = 'margin-top:8px;font-size:14px;font-weight:700;color:' + (correct ? 'var(--ok)' : 'var(--err)') + ';';
  tt.textContent = tip;
  document.getElementById('qAnalysis').insertBefore(tt, document.getElementById('qAnalysis').firstChild);
  document.getElementById('btnNext').textContent = '下一题';
  renderStats();
}
function showCaseAnswer() {
  const q = quiz[qpos];
  const an = document.getElementById('qAnalysis');
  document.getElementById('analysisText').textContent = q.answer || q.analysis || '（本题暂无标准答案）';
  document.getElementById('analysisSrc').textContent = q.source ? '出处：' + q.source : '';
  an.classList.add('show');
  document.getElementById('btnShowAns').style.display = 'none';
  document.getElementById('btnNext').textContent = '下一题';
}
function nextQuestion() {
  if (qpos < quiz.length - 1) { qpos++; renderQuestion(); }
  else { toast('本次练习完成，可切换筛选继续刷题'); startQuiz(); }
}
function prevQuestion() {
  if (qpos > 0) { qpos--; renderQuestion(); }
}
/* ========== 错题本 ========== */
function renderWrong() {
  const wr = lsGet(LS.wrong, []);
  const box = document.getElementById('wrongList');
  if (!wr.length) { box.innerHTML = '<div class="empty">暂无错题，很棒！继续保持 🎉</div>'; return; }
  box.innerHTML = '<div style="font-size:14px;font-weight:700;margin-bottom:8px;">共 ' + wr.length + ' 道错题，点击重做</div>';
  wr.forEach(id => {
    const q = bank.find(x => x.id === id);
    if (!q) return;
    const d = document.createElement('div');
    d.className = 'wrong-item';
    const tag = qType(q);
    const meta = (q.subject || '') + (q.year ? ' ' + q.year : '');
    d.innerHTML = '<span style="flex:1;margin-right:10px;">[' + tag + ' ' + meta + '] ' + (q.question || '').slice(0, 26) + ((q.question || '').length > 26 ? '…' : '') + '</span>';
    const b = document.createElement('button');
    b.textContent = '重做';
    b.onclick = () => {
      filter.subject = q.subject || '全部';
      filter.year = q.year !== undefined && q.year !== '' ? (q.year + '|' + (q.exam || '')) : 'all';
      filter.type = qType(q);
      buildFilters();
      startQuiz();
      const idx = quiz.findIndex(x => x.id === q.id);
      if (idx >= 0) { qpos = idx; renderQuestion(); }
      switchTab('quiz');
    };
    d.appendChild(b);
    box.appendChild(d);
  });
}
/* ========== 打卡 ========== */
function todayStr() {
  const d = new Date(); const p = n => (n < 10 ? '0' : '') + n;
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}
function streakDays() {
  const list = lsGet(LS.checkins, []);
  let streak = 0; const p = n => (n < 10 ? '0' : '') + n;
  const d = new Date();
  if (list.includes(todayStr())) { streak++; }
  else { d.setDate(d.getDate() - 1); }
  const fmt = dd => dd.getFullYear() + '-' + p(dd.getMonth() + 1) + '-' + p(dd.getDate());
  if (!list.includes(todayStr())) { d.setDate(d.getDate() + 1); }
  while (true) {
    d.setDate(d.getDate() - 1);
    if (list.includes(fmt(d))) streak++; else break;
  }
  return streak;
}
function doCheckin() {
  const list = lsGet(LS.checkins, []);
  const t = todayStr();
  if (!list.includes(t)) { list.push(t); lsSet(LS.checkins, list); toast('打卡成功，坚持就是胜利！'); }
  else { toast('今天已经打过卡啦'); }
  renderCheckin();
}
function renderCheckin() {
  const list = lsGet(LS.checkins, []);
  const btn = document.getElementById('btnCheckin');
  if (list.includes(todayStr())) { btn.textContent = '已打卡'; btn.classList.add('done'); }
  else { btn.textContent = '今日打卡'; btn.classList.remove('done'); }
  document.getElementById('streakText').textContent = '连续打卡 ' + streakDays() + ' 天';
  const strip = document.getElementById('weekStrip');
  strip.innerHTML = '';
  const names = ['日', '一', '二', '三', '四', '五', '六'];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const p = n => (n < 10 ? '0' : '') + n;
    const ds = d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
    const on = list.includes(ds);
    const cell = document.createElement('div');
    cell.className = 'day';
    cell.innerHTML = '<div class="dot' + (on ? ' on' : '') + '">' + (on ? '✓' : '') + '</div><div class="w-name">' + names[d.getDay()] + '</div>';
    strip.appendChild(cell);
  }
}
/* ========== 统计 ========== */
function renderStats() {
  const rec = lsGet(LS.record, {});
  const ids = Object.keys(rec);
  const correct = ids.filter(id => rec[id].correct).length;
  document.getElementById('stTotal').textContent = bank.length;
  document.getElementById('stAnswered').textContent = ids.length;
  document.getElementById('stRate').textContent = ids.length ? Math.round(100 * correct / ids.length) + '%' : '—';
  document.getElementById('stWrong').textContent = lsGet(LS.wrong, []).length;
}
/* ========== 导入题库 ========== */
function importBank(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      const arr = Array.isArray(data) ? data : (data.questions || []);
      if (!arr.length) { toast('题库为空或格式不正确'); return; }
      lsSet(LS.userBank, arr);
      bank = arr;
      filter = { subject: '全部', year: 'all', type: '全部' };
      buildFilters(); startQuiz(); renderStats(); refreshBankInfo();
      toast('题库导入成功：' + arr.length + ' 题');
    } catch (err) { toast('导入失败：JSON 解析错误'); }
  };
  reader.readAsText(file, 'utf-8');
  e.target.value = '';
}
/* ========== 清空已导入题库（回退内置题库） ========== */
function clearImported() {
  try { localStorage.removeItem(LS.userBank); } catch (e) {}
  bank = getBank();
  filter = { subject: '全部', year: 'all', type: '全部' };
  buildFilters(); startQuiz(); renderStats(); refreshBankInfo();
  toast('已恢复内置题库');
}
/* ========== Tab 切换 ========== */
function switchTab(name) {
  const map = { quiz: 'viewQuiz', wrong: 'viewWrong', stats: 'viewStats' };
  ['quiz', 'wrong', 'stats'].forEach(k => {
    document.getElementById('view' + k.charAt(0).toUpperCase() + k.slice(1)).style.display = k === name ? '' : 'none';
  });
  document.getElementById('tabQuiz').classList.toggle('active', name === 'quiz');
  document.getElementById('tabWrong').classList.toggle('active', name === 'wrong');
  document.getElementById('tabStats').classList.toggle('active', name === 'stats');
  if (name === 'wrong') renderWrong();
  if (name === 'stats') { renderStats(); renderCheckin(); }
}
/* ========== Toast ========== */
let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.style.opacity = 1;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.style.opacity = 0; }, 1800);
}
/* ========== 初始化 ========== */
function init() {
  bank = getBank();
  buildFilters();
  startQuiz();
  renderStats();
  renderCheckin();
  refreshBankInfo();
}
init();

</script>
